[workspace]
exclude = [
  "test_contracts/compatibility-test", # TODO: add new after cw-orch-core 2.0.0 as it's breaking, it shouldn't be compatible
]
members = [
  "cw-orch",
  "cw-orch-daemon",
  "cw-orch-interchain",
  "packages/cw-orch-core",
  "packages/cw-orch-mock",
  "packages/cw-orch-networks",
  "packages/clone-testing",
  "packages/cw-orch-osmosis-test-tube",
  "packages/cw-orch-neutron-test-tube",
  "packages/cw-orch-traits",
  "test_contracts/*",
  "packages/macros/*",
  "packages/interchain/*",
  "packages/integrations/*",
]
resolver = "2"

[workspace.package]
authors    = ["CyberHoward <cyberhoward@protonmail.com>"]
edition    = "2021"
license    = "LGPL-3.0"
repository = "https://github.com/AbstractSDK/cw-orchestrator"

[workspace.dependencies]
cosmwasm-std     = { version = "3.0.1" }
cw-storage-plus  = { version = "3.0.0" }

cw-multi-test = { package = "abstract-cw-multi-test", version = "2.2.4" }
cosmos-sdk-proto  = { version = "0.27.0" }
cw20 = { version = "2.0.0" }
cw20-base = { version = "2.0.0" }
cw-utils = { version = "3.0.0" }
neutron-test-tube = { version = "5.1.3" }
osmosis-test-tube = { version = "27.0.1" }
cosmrs  = { version = "0.22.0" }
ibc-proto   = { version = "0.52.0" }

anyhow = "1.0"
serde  = { version = "1.0.208", default-features = false, features = ["derive"] }
tokio  = { version = "1.39", features = ["full"] }

cw-orch          = { path = "./cw-orch" }
cw-orch-core     = { path = "packages/cw-orch-core" }
cw-orch-daemon   = { path = "./cw-orch-daemon" }
cw-orch-mock     = { path = "packages/cw-orch-mock" }
cw-orch-networks = { path = "packages/cw-orch-networks" }
cw-orch-traits   = { path = "packages/cw-orch-traits" }

# Macros
cw-orch-contract-derive = { path = "packages/macros/cw-orch-contract-derive", version = "0.21.0" }
cw-orch-fns-derive      = { path = "packages/macros/cw-orch-fns-derive", version = "0.23.0" }

# Extensions
cw-orch-neutron-test-tube = {  version = "0.1.0", path = "packages/cw-orch-neutron-test-tube" }
cw-orch-osmosis-test-tube = { version = "0.4.0", path = "packages/cw-orch-osmosis-test-tube" }

#Clone Testing
cw-orch-clone-testing = { version = "0.8.0", path = "packages/clone-testing" }

# Interchain
cw-orch-interchain        = { path = "cw-orch-interchain", version = "0.8.0" }
cw-orch-interchain-core   = { path = "packages/interchain/interchain-core", version = "0.9.0" }
cw-orch-interchain-daemon = { path = "packages/interchain/interchain-daemon", version = "0.9.0" }
cw-orch-interchain-mock   = { path = "packages/interchain/interchain-mock", version = "0.9.0" }
cw-orch-proto             = { path = "packages/interchain/proto", version = "0.9.0" }
cw-orch-starship          = { path = "packages/interchain/starship", version = "0.7.0" }


prost       = "0.14.1"
prost-types = "0.14.1"
serde_json  = "1.0.125"
sha2        = { version = "0.10.8" }
thiserror   = { version = "1.0.63" }
tonic       = { version = "0.14.1", features = ["codegen"] }
# Test deps
speculoos = "0.11.0"

# Logging
log = "0.4.22"

# Interchain
ibc-chain-registry = { version = "0.29.2" }
ibc-relayer-types  = { version = "0.32.2" }

[patch.crates-io]
# cw-plus
cw20 = { path = "../cw-plus/packages/cw20" }
cw20-base = { path = "../cw-plus/contracts/cw20-base" }
# cw-minus
cw-utils = { path = "../cw-minus/packages/cw-utils" }
# cosmos-rust
cosmrs = { path = "../cosmos-rust/cosmrs" }
cosmos-sdk-proto = { path = "../cosmos-rust/cosmos-sdk-proto" }
# ibc-proto
ibc-proto = { path = "../ibc-proto-rs" }
# osmosis & neutron
osmosis-test-tube = { path = "../osmosis-test-tube/packages/osmosis-test-tube" }
neutron-test-tube = { path = "../neutron-test-tube/packages/neutron-test-tube" }
# tendermint-rs
tendermint-proto = { path = "../tendermint-rs/proto" }
tendermint = { path = "../tendermint-rs/tendermint" }
tendermint-rpc = { path = "../tendermint-rs/rpc" }
# clone-cw-multi-test
clone-cw-multi-test = { path = "../clone-cw-multi-test" }
# cw-multi-test-fork
abstract-cw-multi-test = { path = "../cw-multi-test-fork" }
# osmosis & neutron std
osmosis-std = { path = "../osmosis-rust/packages/osmosis-std" }
neutron-std = { path = "../neutron-std/packages/neutron-std" }
# cw-ibc-demo
simple-ica = { path = "../cw-ibc-demo/packages/simple-ica" }
simple-ica-controller = { path = "../cw-ibc-demo/contracts/simple-ica-controller" }
simple-ica-host = { path = "../cw-ibc-demo/contracts/simple-ica-host" }

[patch.'https://github.com/permissionlessweb/cosmos-rust']
cosmrs = { path = "../cosmos-rust/cosmrs" }
cosmos-sdk-proto = { path = "../cosmos-rust/cosmos-sdk-proto" }
