[workspace]
exclude = [
  "test_contracts/compatibility-test", # TODO: add new after cw-orch-core 2.0.0 as it's breaking, it shouldn't be compatible
  "contracts-ws",
]
members = [
  "cw-orch",
  "cw-orch-daemon",
  "cw-orch-interchain",
  "packages/cw-orch-core",
  "packages/cw-orch-mock",
  "packages/cw-orch-networks",
  "packages/clone-testing",
  "packages/cw-orch-osmosis-test-tube",
  "packages/cw-orch-neutron-test-tube",
  "packages/cw-orch-traits",
  "test_contracts/*",
  "packages/macros/*",
  "packages/interchain/*",
  "packages/integrations/*",
]
resolver = "2"

[workspace.package]
authors    = ["CyberHoward <cyberhoward@protonmail.com>"]
edition    = "2021"
license    = "LGPL-3.0"
repository = "https://github.com/AbstractSDK/cw-orchestrator"

[workspace.dependencies]
cosmwasm-std = { git = "https://github.com/permissionlessweb/cosmwasm", branch = "zk-mvp" }
cw-storage-plus = { git = "https://github.com/permissionlessweb/cw-storage-plus", branch = "zk-mvp" }

cw-multi-test = { package = "abstract-cw-multi-test", git = "https://github.com/permissionlessweb/cw-multi-test-fork", branch = "zk-mvp" }
cosmos-sdk-proto = { git = "https://github.com/permissionlessweb/cosmos-rust", branch = "zk-mvp" }
cw20 = { git = "https://github.com/permissionlessweb/cw-plus", branch = "zk-mvp" }
cw20-base = { git = "https://github.com/permissionlessweb/cw-plus", branch = "zk-mvp" }
cw-utils = { git = "https://github.com/permissionlessweb/cw-minus", branch = "zk-mvp" }
neutron-test-tube = { git = "https://github.com/permissionlessweb/neutron-test-tube", branch = "zk-mvp" }
osmosis-test-tube = { git = "https://github.com/permissionlessweb/osmosis-test-tube", branch = "zk-mvp" }
cosmrs = { git = "https://github.com/permissionlessweb/cosmos-rust", branch = "zk-mvp" }
ibc-proto = { git = "https://github.com/permissionlessweb/ibc-proto-rs", branch = "zk-mvp" }
clone-cw-multi-test = { package = "abstract-cw-multi-test", git = "https://github.com/permissionlessweb/cw-multi-test-fork", branch = "zk-mvp" }
osmosis-std = { git = "https://github.com/permissionlessweb/osmosis-rust", branch = "zk-mvp" }
neutron-std = { git = "https://github.com/permissionlessweb/neutron-std", branch = "zk-mvp" }
simple-ica = { git = "https://github.com/permissionlessweb/cw-ibc-demo", branch = "zk-mvp" }
simple-ica-controller = { git = "https://github.com/permissionlessweb/cw-ibc-demo", branch = "zk-mvp" }
simple-ica-host = { git = "https://github.com/permissionlessweb/cw-ibc-demo", branch = "zk-mvp" }
tendermint = { git = "https://github.com/permissionlessweb/tendermint-rs", branch = "zk-mvp" }
tendermint-proto = { git = "https://github.com/permissionlessweb/tendermint-rs", branch = "zk-mvp" }
tendermint-rpc = { git = "https://github.com/permissionlessweb/tendermint-rs", branch = "zk-mvp" }

anyhow = "1.0"
serde  = { version = "1.0.208", default-features = false, features = ["derive"] }
tokio  = { version = "1.39", features = ["full"] }

cw-orch = { path = "cw-orch" }
cw-orch-core = { path = "packages/cw-orch-core" }
cw-orch-daemon = { path = "cw-orch-daemon" }
cw-orch-mock = { path = "packages/cw-orch-mock" }
cw-orch-networks = { path = "packages/cw-orch-networks" }
cw-orch-traits = { path = "packages/cw-orch-traits" }

# Macros
cw-orch-contract-derive = { path = "packages/macros/cw-orch-contract-derive" }
cw-orch-fns-derive = { path = "packages/macros/cw-orch-fns-derive" }

# Extensions
cw-orch-neutron-test-tube = { path = "packages/cw-orch-neutron-test-tube" }
cw-orch-osmosis-test-tube = { path = "packages/cw-orch-osmosis-test-tube" }

#Clone Testing
cw-orch-clone-testing = { path = "packages/clone-testing" }

# Interchain
cw-orch-interchain = { path = "cw-orch-interchain" }
cw-orch-interchain-core = { path = "packages/interchain/interchain-core" }
cw-orch-interchain-daemon = { path = "packages/interchain/interchain-daemon" }
cw-orch-interchain-mock = { path = "packages/interchain/interchain-mock" }
cw-orch-proto = { path = "packages/interchain/proto" }
cw-orch-starship = { path = "packages/interchain/starship" }


prost       = "0.14.1"
prost-types = "0.14.1"
serde_json  = "1.0.125"
sha2        = { version = "0.10.8" }
thiserror   = { version = "1.0.63" }
tonic       = { version = "0.14.1", features = ["codegen"] }
# Test deps
speculoos = "0.11.0"

# Logging
log = "0.4.22"

# Interchain / Hermes relayer
ibc-chain-registry = { git = "https://github.com/permissionlessweb/hermes", branch = "zk-mvp" }
ibc-relayer-types = { git = "https://github.com/permissionlessweb/hermes", branch = "zk-mvp" }

# Unify crates.io transitive deps with our git forks
[patch.crates-io]

# Resolve self-referencing git deps to local paths


cosmwasm-std = { git = "https://github.com/permissionlessweb/cosmwasm", branch = "zk-mvp" }
cosmwasm-core = { git = "https://github.com/permissionlessweb/cosmwasm", branch = "zk-mvp" }
cosmwasm-crypto = { git = "https://github.com/permissionlessweb/cosmwasm", branch = "zk-mvp" }
cosmwasm-derive = { git = "https://github.com/permissionlessweb/cosmwasm", branch = "zk-mvp" }
cosmwasm-schema = { git = "https://github.com/permissionlessweb/cosmwasm", branch = "zk-mvp" }
cosmwasm-schema-derive = { git = "https://github.com/permissionlessweb/cosmwasm", branch = "zk-mvp" }
cw-schema = { git = "https://github.com/permissionlessweb/cosmwasm", branch = "zk-mvp" }
cw-schema-derive = { git = "https://github.com/permissionlessweb/cosmwasm", branch = "zk-mvp" }
cw-storage-plus = { git = "https://github.com/permissionlessweb/cw-storage-plus", branch = "zk-mvp" }
[patch.'https://github.com/permissionlessweb/cw-orchestrator']
cw-orch = { path = "cw-orch" }
cw-orch-core = { path = "packages/cw-orch-core" }
cw-orch-daemon = { path = "cw-orch-daemon" }
cw-orch-mock = { path = "packages/cw-orch-mock" }
cw-orch-networks = { path = "packages/cw-orch-networks" }
cw-orch-traits = { path = "packages/cw-orch-traits" }
cw-orch-contract-derive = { path = "packages/macros/cw-orch-contract-derive" }
cw-orch-fns-derive = { path = "packages/macros/cw-orch-fns-derive" }

