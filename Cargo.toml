[workspace]
exclude = [
    # TODO: add new after cw-orch-core 2.0.0 as it's breaking, it shouldn't be compatible
    "contracts-ws",
    "test_contracts/compatibility-test",
]
members = [
    "cw-orch",
    "cw-orch-daemon",
    "cw-orch-interchain",
    "packages/clone-testing",
    "packages/cw-orch-core",
    "packages/cw-orch-mock",
    "packages/cw-orch-networks",
    "packages/cw-orch-neutron-test-tube",
    "packages/cw-orch-osmosis-test-tube",
    "packages/cw-orch-traits",
    "packages/integrations/*",
    "packages/interchain/*",
    "packages/macros/*",
    "test_contracts/*",
]
resolver = "2"

[workspace.package]
authors    = ["CyberHoward <cyberhoward@protonmail.com>"]
edition    = "2021"
license    = "LGPL-3.0"
repository = "https://github.com/AbstractSDK/cw-orchestrator"

[workspace.features]
default = []
zk = ["cosmwasm-std/zk", "dep:zk-cosmwasm"]

[workspace.dependencies]
cosmwasm-std = { git = "ssh://returniflost@groot-wan/Users/returniflost/abstract/terp-core/crates/cosmwasm", branch = "v3.1.0-zk.0", package = "cosmwasm-std" }
cw-storage-plus = { git = "ssh://returniflost@groot-wan/Users/returniflost/abstract/terp-core/crates/cw-storage-plus", branch = "v3.1.0-zk.0" }

clone-cw-multi-test = { package = "cw-multi-test", git = "ssh://returniflost@groot-wan/Users/returniflost/abstract/terp-core/crates/clone-cw-multi-test", branch = "cw3/adapt_for_local_execution", features = ["cosmwasm_3_0"] }
cosmos-sdk-proto = { git = "ssh://returniflost@groot-wan/Users/returniflost/abstract/terp-core/crates/cosmos-rust", branch = "v3.1.0-zk.0", package = "cosmos-sdk-proto" }
cosmrs = { git = "ssh://returniflost@groot-wan/Users/returniflost/abstract/terp-core/crates/cosmos-rust", branch = "v3.1.0-zk.0", package = "cosmrs" }
cw-multi-test = { package = "abstract-cw-multi-test", git = "ssh://returniflost@groot-wan/Users/returniflost/abstract/terp-core/crates/cw-multi-test-fork", branch = "zk-mvp" }
cw-utils = { git = "ssh://returniflost@groot-wan/Users/returniflost/abstract/terp-core/crates/cw-minus", branch = "main", package = "cw-utils" }
cw20 = { git = "ssh://returniflost@groot-wan/Users/returniflost/abstract/terp-core/crates/cw-plus", branch = "v3.1.0-zk.0", package = "cw20" }
cw20-base = { git = "ssh://returniflost@groot-wan/Users/returniflost/abstract/terp-core/crates/cw-plus", branch = "v3.1.0-zk.0", package = "cw20-base" }
ibc-proto = { git = "ssh://returniflost@groot-wan/Users/returniflost/abstract/terp-core/crates/ibc-proto-rs", branch = "v3.1.0-zk.0" }
neutron-std = { git = "ssh://returniflost@groot-wan/Users/returniflost/abstract/terp-core/crates/neutron-std", branch = "v3.1.0-zk.0", package = "neutron-std" }
neutron-test-tube = { git = "ssh://returniflost@groot-wan/Users/returniflost/abstract/terp-core/crates/neutron-test-tube", branch = "dev", package = "neutron-test-tube" }
osmosis-std = { git = "ssh://returniflost@groot-wan/Users/returniflost/abstract/terp-core/crates/osmosis-rust", branch = "cw3", package = "osmosis-std" }
osmosis-test-tube = { git = "ssh://returniflost@groot-wan/Users/returniflost/abstract/terp-core/crates/osmosis-test-tube", branch = "cw3", package = "osmosis-test-tube" }
simple-ica = { git = "ssh://returniflost@groot-wan/Users/returniflost/abstract/terp-core/crates/cw-ibc-demo", branch = "cosmwasm3", package = "simple-ica" }
simple-ica-controller = { git = "ssh://returniflost@groot-wan/Users/returniflost/abstract/terp-core/crates/cw-ibc-demo", branch = "cosmwasm3", package = "simple-ica-controller" }
simple-ica-host = { git = "ssh://returniflost@groot-wan/Users/returniflost/abstract/terp-core/crates/cw-ibc-demo", branch = "cosmwasm3", package = "simple-ica-host" }
tendermint = { git = "ssh://returniflost@groot-wan/Users/returniflost/abstract/terp-core/crates/tendermint-rs", branch = "v3.1.0-zk.0", package = "tendermint" }
tendermint-proto = { git = "ssh://returniflost@groot-wan/Users/returniflost/abstract/terp-core/crates/tendermint-rs", branch = "v3.1.0-zk.0", package = "tendermint-proto" }
tendermint-rpc = { git = "ssh://returniflost@groot-wan/Users/returniflost/abstract/terp-core/crates/tendermint-rs", branch = "v3.1.0-zk.0", package = "tendermint-rpc" }
zk-cosmwasm = { git = "ssh://returniflost@groot-wan/Users/returniflost/abstract/terp-core/crates/cosmwasm", branch = "v3.1.0-zk.0", package = "zk-cosmwasm" }

anyhow = "1.0"
serde  = { version = "1.0.208", default-features = false, features = ["derive"] }
tokio  = { version = "1.39", features = ["full"] }

cw-orch = { path = "cw-orch" }
cw-orch-core = { path = "packages/cw-orch-core" }
cw-orch-daemon = { path = "cw-orch-daemon" }
cw-orch-mock = { path = "packages/cw-orch-mock" }
cw-orch-networks = { path = "packages/cw-orch-networks" }
cw-orch-traits = { path = "packages/cw-orch-traits" }

# Macros
cw-orch-circuit-derive = { path = "packages/macros/cw-orch-circuit-derive" }
cw-orch-contract-derive = { path = "packages/macros/cw-orch-contract-derive" }
cw-orch-fns-derive = { path = "packages/macros/cw-orch-fns-derive" }

# Extensions
cw-orch-neutron-test-tube = { path = "packages/cw-orch-neutron-test-tube" }
cw-orch-osmosis-test-tube = { path = "packages/cw-orch-osmosis-test-tube" }

#Clone Testing
cw-orch-clone-testing = { path = "packages/clone-testing" }

# Interchain
cw-orch-interchain = { path = "cw-orch-interchain" }
cw-orch-interchain-core = { path = "packages/interchain/interchain-core" }
cw-orch-interchain-daemon = { path = "packages/interchain/interchain-daemon" }
cw-orch-interchain-mock = { path = "packages/interchain/interchain-mock" }
cw-orch-proto = { path = "packages/interchain/proto" }
cw-orch-starship = { path = "packages/interchain/starship" }

prost       = "0.14.1"
prost-types = "0.14.1"
serde_json  = "1.0.125"
sha2        = { version = "0.10.8" }
# Test deps
speculoos = "0.11.0"
thiserror   = { version = "1.0.63" }
tonic       = { version = "0.14.1", features = ["codegen"] }

# Logging
log = "0.4.22"

# Interchain / Hermes relayer
ibc-chain-registry = { git = "ssh://returniflost@groot-wan/Users/returniflost/abstract/terp-core/crates/hermes", branch = "feat/feature-gate", package = "ibc-chain-registry" }
ibc-relayer-types = { git = "ssh://returniflost@groot-wan/Users/returniflost/abstract/terp-core/crates/hermes", branch = "feat/feature-gate", package = "ibc-relayer-types" }

# Unify crates.io transitive deps with our git forks
[patch.crates-io]
# Resolve self-referencing git deps to local paths

cosmwasm-std = { path = "../cosmwasm/packages/std" }
cosmwasm-core = { path = "../cosmwasm/packages/core" }
cosmwasm-crypto = { path = "../cosmwasm/packages/crypto" }
cosmwasm-derive = { path = "../cosmwasm/packages/derive" }
cosmwasm-schema = { path = "../cosmwasm/packages/schema" }
cosmwasm-schema-derive = { path = "../cosmwasm/packages/schema-derive" }
cw-schema = { path = "../cosmwasm/packages/cw-schema" }
cw-schema-derive = { path = "../cosmwasm/packages/cw-schema-derive" }
cw-storage-plus = { path = "../cw-storage-plus" }

[patch.'https://github.com/permissionlessweb/cw-orchestrator']
cw-orch = { path = "cw-orch" }
cw-orch-clone-testing = { path = "packages/clone-testing" }
cw-orch-core = { path = "packages/cw-orch-core" }
cw-orch-daemon = { path = "cw-orch-daemon" }
cw-orch-interchain = { path = "cw-orch-interchain" }
cw-orch-interchain-core = { path = "packages/interchain/interchain-core" }
cw-orch-interchain-daemon = { path = "packages/interchain/interchain-daemon" }
cw-orch-interchain-mock = { path = "packages/interchain/interchain-mock" }
cw-orch-mock = { path = "packages/cw-orch-mock" }
cw-orch-networks = { path = "packages/cw-orch-networks" }
cw-orch-neutron-test-tube = { path = "packages/cw-orch-neutron-test-tube" }
cw-orch-osmosis-test-tube = { path = "packages/cw-orch-osmosis-test-tube" }
cw-orch-proto = { path = "packages/interchain/proto" }
cw-orch-starship = { path = "packages/interchain/starship" }
cw-orch-traits = { path = "packages/cw-orch-traits" }
cw-plus-orch = { path = "packages/integrations/cw-plus" }