[package]
description   = "cw-orch interfaces for cw-plus base contracts"
documentation = "https://orchestrator.abstract.money"
edition       = "2021"
homepage      = "https://abstract.money"
license       = "Apache-2.0"
name          = "cw-plus-orch"
repository    = "https://github.com/AbstractSDK/cw-orchestrator"
version       = "0.25.0"                                         # Version of cw-orch that's used

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
cosmwasm-schema = { path = "../../../../cosmwasm/packages/schema" }
cosmwasm-std    = { workspace = true }
cw-utils        = { workspace = true }

cw-controllers = { path = "../../../../cw-minus/packages/controllers" }
cw1 = { path = "../../../../cw-plus/packages/cw1" }
cw1-subkeys = { path = "../../../../cw-plus/contracts/cw1-subkeys", features = ["library"] }
cw1-whitelist = { path = "../../../../cw-plus/contracts/cw1-whitelist" }
cw20 = { path = "../../../../cw-plus/packages/cw20" }
cw20-base = { path = "../../../../cw-plus/contracts/cw20-base" }
cw20-ics20 = { path = "../../../../cw-plus/contracts/cw20-ics20" }
cw3 = { path = "../../../../cw-plus/packages/cw3" }
cw3-fixed-multisig = { path = "../../../../cw-plus/contracts/cw3-fixed-multisig", features = ["library"] }
cw3-flex-multisig = { path = "../../../../cw-plus/contracts/cw3-flex-multisig", features = ["library"] }
cw4 = { path = "../../../../cw-plus/packages/cw4" }
cw4-group = { path = "../../../../cw-plus/contracts/cw4-group" }
cw4-stake = { path = "../../../../cw-plus/contracts/cw4-stake", features = ["library"] }

cw-orch-from-interface-derive = { version = "0.1.0", path = "../../macros/from-interface-derive" }

cw-orch = { workspace = true }

[dev-dependencies]
cw-orch            = { workspace = true, features = ["daemon"] }
cw-orch-interchain = { workspace = true }
dotenv             = "0.15.0"
octocrab           = "0.39.0"
pretty_env_logger  = "0.5.0"
reqwest            = "0.12.7"
tokio.workspace    = true
