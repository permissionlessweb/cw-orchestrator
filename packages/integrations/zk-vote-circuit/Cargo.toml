[package]
name        = "zk-vote-circuit"
description = "ZK voting circuit implementing cw-orch CircuitInstance + CircuitUploadable for Terp Network (AI-SLOP)"
edition     = "2021"
version     = "0.1.0"

[features]
default = []

[dependencies]
cw-orch-core = { workspace = true, features = ["terp"] }
zk-cosmwasm  = { workspace = true }

# Halo2 PLONK proof system
halo2_proofs = { path = "../../../../zcash/halo2/halo2_proofs" }

# Halo2 gadget library (Poseidon chip for in-circuit hashing)
halo2_gadgets = { path = "../../../../zcash/halo2/halo2_gadgets", default-features = false }

# Poseidon hash (off-chain Merkle tree + identity commitments + in-circuit)
halo2_poseidon = { path = "../../../../zcash/halo2/halo2_poseidon", default-features = false }
pasta_curves   = "0.5"
ff             = { version = "0.13", default-features = false }
group          = "0.13"

# Key generation deps
rand = "0.8"

# Key derivation
sha2 = { workspace = true }

# Serialization
serde      = { workspace = true }
serde_json = { workspace = true }

# Logging / error handling
log    = { workspace = true }
anyhow = { workspace = true }

[[bin]]
name = "gen_zk_vote_keys"
path = "src/bin/gen_zk_vote_keys.rs"

[dev-dependencies]
speculoos  = { workspace = true }
anyhow     = { workspace = true }