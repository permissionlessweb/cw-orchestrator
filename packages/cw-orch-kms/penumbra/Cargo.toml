[package]
name = "cw-orch-kms-penumbra"
version = "0.1.0"
edition = "2021"
description = "Build root for cw-orch-kms Penumbra custody (src/penumbra + src/ui_shared.rs)"
license = "LGPL-3.0"
publish = false
build = "build.rs"

# Own root and lock: penumbra v2.1.1 needs crates.io prost 0.13 / tendermint
# 0.40; the cw-orchestrator workspace patches those to prost-0.14 forks.
[workspace]

[lib]
name = "cw_orch_kms_penumbra"
path = "lib.rs"

[[bin]]
name = "penumbra-zigner-custody"
path = "../src/penumbra/bin/penumbra-zigner-custody.rs"

[[example]]
name = "test_only_fvk"
path = "examples/test_only_fvk.rs"

[[test]]
name = "penumbra"
path = "tests/penumbra.rs"

[dependencies]
# shared page (ui_shared.rs): same versions as packages/cw-orch-kms
axum = "=0.8.9"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
raptorq = "1.8.1"
rand = "0.8"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
# penumbra
penumbra-sdk-proto = { git = "https://github.com/penumbra-zone/penumbra", tag = "v2.1.1", features = ["rpc"] }
penumbra-sdk-transaction = { git = "https://github.com/penumbra-zone/penumbra", tag = "v2.1.1" }
penumbra-sdk-keys = { git = "https://github.com/penumbra-zone/penumbra", tag = "v2.1.1" }
penumbra-sdk-custody = { git = "https://github.com/penumbra-zone/penumbra", tag = "v2.1.1" }
penumbra-sdk-asset = { git = "https://github.com/penumbra-zone/penumbra", tag = "v2.1.1" }
penumbra-sdk-num = { git = "https://github.com/penumbra-zone/penumbra", tag = "v2.1.1" }
penumbra-sdk-dex = { git = "https://github.com/penumbra-zone/penumbra", tag = "v2.1.1", default-features = false }
penumbra-sdk-shielded-pool = { git = "https://github.com/penumbra-zone/penumbra", tag = "v2.1.1", default-features = false }
penumbra-sdk-fee = { git = "https://github.com/penumbra-zone/penumbra", tag = "v2.1.1", default-features = false }
penumbra-sdk-txhash = { git = "https://github.com/penumbra-zone/penumbra", tag = "v2.1.1" }
decaf377 = "0.10.1"
decaf377-rdsa = "0.11"
tonic012 = { package = "tonic", version = "0.12.3" }
prost013 = { package = "prost", version = "0.13.4" }
anyhow = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
subtle = "2"
ur = "0.4"
tokio-stream = { version = "0.1", features = ["net"] }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
penumbra-sdk-tct = { git = "https://github.com/penumbra-zone/penumbra", tag = "v2.1.1" }
ibc-types = { version = "0.15", default-features = false }
rand_chacha = "0.3"
