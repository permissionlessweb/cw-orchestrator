[workspace]

members = ["contracts/*"]

resolver = "2"

[workspace.package]
edition = "2021"

[workspace.dependencies]
cosmwasm-std    = "3.0.1"
cw-storage-plus = { version = "3.0.0" }
cw20             = { path = "../../cw-plus/packages/cw20" }
cw20-base        = { path = "../../cw-plus/contracts/cw20-base" }

anyhow = "1.0"
log    = "0.4.14"
serde  = { version = "1.0.103", default-features = false, features = ["derive"] }

cw-orch            = { path = "../cw-orch", version = "0.30.0" }
cw-orch-interchain = { path = "../cw-orch-interchain", version = "0.8.1" }
